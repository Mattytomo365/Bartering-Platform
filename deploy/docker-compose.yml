services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    volumes: [ "mssql_data:/var/opt/mssql" ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBIT_VHOST}
    ports: ["5672:5672", "15672:15672"]
    volumes: [ "rabbitmq_data:/var/lib/rabbitmq" ]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  listings-service:
    build: { context: ../ListingService, dockerfile: Web/Dockerfile }
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Sql: ${SQL_CONN_LISTINGS} # Compose environment variables within the container and override ASP.NET configuration keys
      RabbitMQ__ConnectionString: ${RABBIT_CONN}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    depends_on:
      sql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    ports: ["5093:8080"]

  discovery-service:
    build: { context: ../DiscoveryService, dockerfile: Web/Dockerfile }
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Sql: ${SQL_CONN_DISCOVERY}
      RabbitMQ__ConnectionString: ${RABBIT_CONN}
    depends_on:
      sql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    ports: ["5084:8080"]

  profile-service:
    build: { context: ../ProfileService, dockerfile: Web/Dockerfile }
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Sql: ${SQL_CONN_PROFILES}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    depends_on:
      sql:
        condition: service_healthy
    ports: ["5114:8080"]

  api-gateway:
    build: { context: ../ApiGatewayService, dockerfile: Web/Dockerfile }
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Docker
      DownstreamServices__Listing: http://listings-service:8080
      DownstreamServices__Discovery: http://discovery-service:8080
      DownstreamServices__Profile: http://profile-service:8080
      DownstreamApiKey: ${DOWNSTREAM_API_KEY}
    depends_on: [ listings-service, discovery-service, profile-service ]
    ports: ["5039:8080"]

volumes:
  mssql_data:
  rabbitmq_data: